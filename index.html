<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rebost Familiar</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🥫 Rebost Familiar</h1>

  <button onclick="nouProducte()">
    ➕ Nou producte
  </button>
</header>

<main>

  <div class="card">
    <h2>📦 Inventari</h2>

    <div id="inventari">
      Carregant productes...
    </div>
  </div>

  <div class="card">
    <h2>🛒 Llista de compra</h2>
    <p>Productes pendents de comprar.</p>
  </div>

  <div class="card">
    <h2>⚠️ Stock baix</h2>
    <p>Productes per sota del mínim.</p>
  </div>

  <div class="card">
    <h2>⏳ Caduca aviat</h2>
    <p>Productes propers a caducar.</p>
  </div>

</main>

<div id="formulariProducte" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
z-index:1000;
">

   <div style="
background:white;
padding:30px;
border-radius:12px;
width:400px;
max-width:90%;
">

  <h2>Nou producte</h2>

  <label>Nom</label><br>
  <input type="text" id="nouNom"><br><br>

  <label>Categoria</label><br>
  <input type="text" id="novaCategoria"><br><br>

  <label>Quantitat</label><br>
  <input type="number" id="novaQuantitat"><br><br>

  <label>Ubicació</label><br>
  <input type="text" id="novaUbicacio"><br><br>

  <label>Mínim</label><br>
  <input type="number" id="nouMinim"><br><br>

  <label>Data caducitat</label><br>
  <input type="date" id="novaCaducitat"><br><br>

  <label>Lloc compra</label><br>
  <input type="text" id="nouLlocCompra"><br><br>

  <button id="guardarProducte">Guardar</button>
  <button id="cancelarProducte">Cancel·lar</button>
</div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwZGaCwO3C_R0Sp11OrXwulxIiDTbxmPA3DBcVH0TruxyIPvB3V7Hg3nfvzYg5YBKQf/exec";

fetch(API_URL)
  .then(res => res.json())
  .then(productes => {

    let html = "";

    productes.forEach(producte => {

      html += `
        <p>
          <strong>${producte.Nom}</strong>
          (${producte.Quantitat})
        </p>
      `;

    });

    document.getElementById("inventari").innerHTML = html;

  });

function nouProducte() {
  
  document.getElementById("formulariProducte").style.display = "flex";

}

document.getElementById("cancelarProducte").onclick = function() {

  document.getElementById("formulariProducte").style.display = "none";

};

document.getElementById("guardarProducte").onclick = function() {

  const nom = document.getElementById("nouNom").value;
  const categoria = document.getElementById("novaCategoria").value;
  const quantitat = document.getElementById("novaQuantitat").value;
  const ubicacio = document.getElementById("novaUbicacio").value;
  const minim = document.getElementById("nouMinim").value;
  const dataCaducitat = document.getElementById("novaCaducitat").value;
  const llocCompra = document.getElementById("nouLlocCompra").value;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      nom,
      categoria,
      quantitat,
      ubicacio,
      minim,
      dataCaducitat,
      llocCompra
    })
  })
  .then(() => {
    alert("Producte afegit!");
    location.reload();
  })
  .catch(error => {
    console.error(error);
    alert("ERROR");
  });

};

</script>

</body>
</html>
