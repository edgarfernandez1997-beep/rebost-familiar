<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rebost Familiar</title>

  <link rel="stylesheet" href="style.css">
</head>
  
<body>

  <header>
    <h1>🥫 Rebost Familiar</h1>
  </header>

  <main>

<div class="card">
  <h2>📦 Inventari</h2>

  <div id="inventari">
    Carregant productes...
  </div>
</div>

    <div class="card">
      <h2>🛒 Llista de compra</h2>
      <p>Productes pendents de comprar.</p>
    </div>

    <div class="card">
      <h2>⚠️ Stock baix</h2>
      <p>Productes per sota del mínim.</p>
    </div>

    <div class="card">
      <h2>⏳ Caduca aviat</h2>
      <p>Productes propers a caducar.</p>
    </div>

  </main>
  
<script>

fetch("https://script.google.com/macros/s/AKfycbzFZdGk3ShESicdqN50dEpDV21g_Ssf4NPZ6gSNoZp_ORDIQmkN0Di0nG3qvgevDqRI/exec")
  .then(res => res.json())
  .then(productes => {

    let html = "";

    productes.forEach(producte => {

      html += `
        <p>
          <strong>${producte.Nom}</strong>
          (${producte.Quantitat})
        </p>
      `;

    });

    document.getElementById("inventari").innerHTML = html;

  });

</script>
  
</body>

</html>
