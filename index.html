<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rebost Familiar</title>

  <link rel="stylesheet" href="style.css">
</head>
  
<body>

<header>
  <h1>🥫 Rebost Familiar</h1>

  <button onclick="nouProducte()">
    ➕ Nou producte
  </button>
</header>

  <main>

<div class="card">
  <h2>📦 Inventari</h2>

  <div id="inventari">
    Carregant productes...
  </div>
</div>

    <div class="card">
      <h2>🛒 Llista de compra</h2>
      <p>Productes pendents de comprar.</p>
    </div>

    <div class="card">
      <h2>⚠️ Stock baix</h2>
      <p>Productes per sota del mínim.</p>
    </div>

    <div class="card">
      <h2>⏳ Caduca aviat</h2>
      <p>Productes propers a caducar.</p>
    </div>

  </main>
  
<script>

fetch("https://script.google.com/macros/s/AKfycbwZGaCwO3C_R0Sp11OrXwulxIiDTbxmPA3DBcVH0TruxyIPvB3V7Hg3nfvzYg5YBKQf/exec")
  .then(res => res.json())
  .then(productes => {

    let html = "";

    productes.forEach(producte => {

      html += `
        <p>
          <strong>${producte.Nom}</strong>
          (${producte.Quantitat})
        </p>
      `;

    });

    document.getElementById("inventari").innerHTML = html;

  });

function nouProducte() {

  const nom = prompt("Nom del producte:");

  if (!nom) return;

  const quantitat = prompt("Quantitat:");

  if (!quantitat) return;

  fetch("https://script.google.com/macros/s/AKfycbwZGaCwO3C_R0Sp11OrXwulxIiDTbxmPA3DBcVH0TruxyIPvB3V7Hg3nfvzYg5YBKQf/exec", {
    method: "POST",
    body: JSON.stringify({
      nom: nom,
      quantitat: quantitat
    })
  })
  .then(res => {
    console.log("RESPOSTA:", res);
    alert("Producte afegit!");
  })
  .catch(error => {
    console.error("ERROR", error);
    alert("ERROR");
  });

}
  
</script>
  
</body>

</html>
